name: Bug report
description: rn-xtool fails or does something unexpected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Run `rn-xtool doctor --report` in your project folder and paste its whole output below. rn-xtool replaces your home folder, Apple ID, Team ID, bundle identifiers, device names and UDIDs, IP and MAC addresses and tokens with placeholders. Read it before you post: remove anything else you consider private."
  - type: textarea
    id: report
    attributes:
      label: Output of rn-xtool doctor --report
      render: text
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: rn-xtool build
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: The error and the last lines of output. Remove anything private.
    validations:
      required: true
  - type: checkboxes
    id: reviewed
    attributes:
      label: Privacy
      options:
        - label: I read the report and the output above and removed anything private.
          required: true
